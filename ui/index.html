        <span id="clk">00:00</span>
        <span class="eq"><i></i><i></i><i></i><i></i></span>

        <div id="pages"></div>
        <button class="nav next" id="next">&#8250;</button>
        <div id="dots"></div>
      </div>
    </div>
  </div>

  <script src="core.js"></script>
  <script src="modules/music.js"></script>
