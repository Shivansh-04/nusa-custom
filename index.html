<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>Custom Notch</title>
  <link rel="stylesheet" href="styles.css" />
  <script defer src="renderer.js"></script>
</head>
<body>
  <main id="notch" class="notch" data-expanded="false">
    <header class="topbar">
      <button id="brandButton" class="brand" aria-label="Toggle notch" title="Toggle notch">
        <span class="brand-dot"></span><span class="brand-name">orbit</span>
      </button>
      <div class="top-status"><span id="statusDot" class="status-dot"></span><span id="statusText">Ready</span></div>
      <div class="top-actions">
        <button id="settingsButton" class="icon-button" aria-label="Open settings" title="Settings">⚙</button>
        <button id="collapseButton" class="icon-button" aria-label="Collapse notch" title="Collapse">⌃</button>
      </div>
    </header>

    <section id="content" class="content" aria-label="Notch controls">
      <nav class="tabs" aria-label="Panels">
        <button class="tab active" data-panel="focus">Focus</button>
        <button class="tab" data-panel="settings">Settings</button>
      </nav>

      <section id="focusPanel" class="panel">
        <div class="timer-layout">
          <div class="timer-ring" id="timerRing"><div class="timer-inner"><span id="timerTime">25:00</span><small id="timerMode">FOCUS SESSION</small></div></div>
          <div class="timer-copy">
            <p class="eyebrow">MAKE ROOM FOR DEEP WORK</p>
            <h1 id="focusHeading">One thing at a time.</h1>
            <p class="muted">Start a session. The timer runs in the desktop process, even if this panel is collapsed.</p>
            <div class="timer-actions">
              <button id="startPauseButton" class="primary-button">Start focus</button>
              <button id="resetButton" class="secondary-button">Reset</button>
              <button id="switchModeButton" class="text-button">Switch to break</button>
            </div>
          </div>
        </div>
        <div class="bottom-note"><span>⌘</span> <span>Ctrl + Shift + Space toggles this notch</span><span class="note-spacer"></span><span id="sessionState">Not running</span></div>
      </section>

      <section id="settingsPanel" class="panel settings-panel" hidden>
        <div class="settings-heading"><div><p class="eyebrow">PERSONALIZE YOUR SPACE</p><h2>Settings</h2></div><span class="settings-tag">Saved on this PC</span></div>
        <form id="settingsForm">
          <label class="setting-row"><span><strong>Focus duration</strong><small>Minutes per focus session</small></span><input id="focusMinutes" type="number" min="1" max="180" value="25" required /></label>
          <label class="setting-row"><span><strong>Break duration</strong><small>Minutes per break</small></span><input id="breakMinutes" type="number" min="1" max="60" value="5" required /></label>
          <label class="setting-row"><span><strong>Keep above other windows</strong><small>Keep the notch visible</small></span><input id="alwaysOnTop" type="checkbox" checked /></label>
          <label class="setting-row"><span><strong>Start when I sign in</strong><small>Launch this app at Windows login</small></span><input id="launchAtLogin" type="checkbox" /></label>
          <div class="settings-footer"><p id="settingsMessage" role="status" aria-live="polite">Changes are stored locally.</p><button class="primary-button" type="submit">Save settings</button></div>
        </form>
      </section>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
